<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced 3D Mind Map</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Exo 2', sans-serif;
            background: radial-gradient(ellipse at center, #0f0f23 0%, #000000 70%);
            overflow: hidden;
            cursor: grab;
        }
        
        body:active {
            cursor: grabbing;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* Animated background particles */
        .bg-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.1), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(0,212,255,0.1), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255,107,107,0.1), transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,206,84,0.1), transparent);
            animation: float 20s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
        
        /* Enhanced control panel */
        #controls {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(15,15,35,0.95) 0%, rgba(25,25,45,0.9) 100%);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0,212,255,0.3);
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.1);
            min-width: 280px;
            animation: slideInLeft 0.8s ease-out;
        }
        
        @keyframes slideInLeft {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        #controls h3 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 20px;
            margin: 0 0 20px 0;
            background: linear-gradient(45deg, #00d4ff, #0099ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,212,255,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(0,212,255,0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(0,212,255,0.8)); }
        }
        
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        #controls button {
            background: linear-gradient(45deg, #1a1a2e, #16213e);
            border: 2px solid rgba(0,212,255,0.3);
            color: #00d4ff;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        #controls button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        #controls button:hover::before {
            left: 100%;
        }
        
        #controls button:hover {
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 
                0 10px 25px rgba(0,212,255,0.4),
                0 0 0 1px rgba(0,212,255,0.5);
        }
        
        #controls button:active {
            transform: translateY(-1px);
        }
        
        /* Stats panel */
        #stats {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(15,15,35,0.95) 0%, rgba(25,25,45,0.9) 100%);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,107,107,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: slideInRight 0.8s ease-out;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        #stats .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #fff;
        }
        
        #stats .stat-value {
            color: #ff6b6b;
            font-weight: 600;
        }
        
        /* Node info panel */
        #nodeInfo {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(15,15,35,0.95) 0%, rgba(25,25,45,0.9) 100%);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,206,84,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 320px;
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }
        
        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .node-title {
            font-family: 'Orbitron', monospace;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px currentColor;
        }
        
        .node-description {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .node-connections {
            font-size: 12px;
            color: #888;
            font-style: italic;
        }
        
        /* Instructions panel */
        #instructions {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(15,15,35,0.95) 0%, rgba(25,25,45,0.9) 100%);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            border: 2px solid rgba(123,237,159,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 300px;
            animation: slideInUp 0.8s ease-out;
        }
        
        @keyframes slideInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        #instructions h4 {
            color: #7bed9f;
            margin-bottom: 15px;
            font-family: 'Orbitron', monospace;
            font-size: 16px;
        }
        
        #instructions ul {
            list-style: none;
            padding: 0;
        }
        
        #instructions li {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }
        
        #instructions li::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: #7bed9f;
            font-size: 10px;
        }
        
        /* Loading screen */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0f23, #000000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeOut 1s ease-out 2s forwards;
        }
        
        @keyframes fadeOut {
            to { opacity: 0; pointer-events: none; }
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0,212,255,0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-family: 'Orbitron', monospace;
            color: #00d4ff;
            font-size: 18px;
            font-weight: 600;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            #controls, #stats, #nodeInfo, #instructions {
                position: relative;
                margin: 10px;
                max-width: none;
            }
            
            #controls {
                top: 10px;
                left: 10px;
                right: 10px;
                padding: 15px;
            }
            
            .control-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="bg-particles"></div>
    
    <div id="loading">
        <div class="loader"></div>
        <div class="loading-text">Initializing Neural Network...</div>
    </div>
    
    <div id="container">
        <div id="controls">
            <h3>🧠 NEURAL INTERFACE</h3>
            <div class="control-group">
                <button onclick="resetView()">🏠 Reset View</button>
                <button onclick="expandAll()">📤 Expand All</button>
                <button onclick="collapseAll()">📥 Collapse All</button>
            </div>
            <div class="control-group">
                <button onclick="addRandomNode()">➕ Add Node</button>
                <button onclick="togglePhysics()">⚡ Physics</button>
                <button onclick="toggleConnections()">🔗 Connections</button>
            </div>
        </div>
        
        <div id="stats">
            <div class="stat-item">
                <span>Nodes:</span>
                <span class="stat-value" id="nodeCount">0</span>
            </div>
            <div class="stat-item">
                <span>Connections:</span>
                <span class="stat-value" id="connectionCount">0</span>
            </div>
            <div class="stat-item">
                <span>FPS:</span>
                <span class="stat-value" id="fps">60</span>
            </div>
        </div>
        
        <div id="nodeInfo">
            <div class="node-title" id="nodeTitle"></div>
            <div class="node-description" id="nodeDescription"></div>
            <div class="node-connections" id="nodeConnections"></div>
        </div>
        
        <div id="instructions">
            <h4>🎮 CONTROLS</h4>
            <ul>
                <li>Drag to rotate camera</li>
                <li>Scroll to zoom in/out</li>
                <li>Click nodes to expand/collapse</li>
                <li>Hover for detailed information</li>
                <li>Double-click to focus on node</li>
            </ul>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global variables
        let scene, camera, renderer, controls;
        let nodes = new Map();
        let edges = [];
        let nodeGeometry, connectionLines = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let selectedNode = null;
        let animationId;
        let physicsEnabled = true;
        let connectionsVisible = true;
        let clock = new THREE.Clock();
        let composer;
        
        // Performance tracking
        let frameCount = 0;
        let lastTime = performance.now();
        
        // Enhanced particle system
        let particleSystem;
        let particleCount = 2000;
        
        // Knowledge graph data with richer information
        const graphData = {
            nodes: [
                { 
                    id: 'root', 
                    label: 'NEURAL CORE', 
                    position: [0, 0, 0], 
                    expanded: true, 
                    color: '#00d4ff',
                    size: 1.0,
                    description: 'Central processing unit of the knowledge network. All information flows through this core.',
                    connections: []
                },
                { 
                    id: 'ai', 
                    label: 'ARTIFICIAL INTELLIGENCE', 
                    position: [4, 2, 2], 
                    expanded: false, 
                    color: '#ff6b6b',
                    size: 0.8,
                    description: 'Advanced computational systems that simulate human intelligence and learning capabilities.',
                    connections: []
                },
                { 
                    id: 'quantum', 
                    label: 'QUANTUM COMPUTING', 
                    position: [-4, 3, 1], 
                    expanded: false, 
                    color: '#4ecdc4',
                    size: 0.8,
                    description: 'Revolutionary computing paradigm utilizing quantum mechanical phenomena for processing.',
                    connections: []
                },
                { 
                    id: 'biotech', 
                    label: 'BIOTECHNOLOGY', 
                    position: [2, -3, 3], 
                    expanded: false, 
                    color: '#45b7d1',
                    size: 0.8,
                    description: 'Integration of biological systems with technological innovations for medical advancement.',
                    connections: []
                },
                { 
                    id: 'space', 
                    label: 'SPACE EXPLORATION', 
                    position: [-3, -2, -3], 
                    expanded: false, 
                    color: '#f9ca24',
                    size: 0.8,
                    description: 'Frontier of human knowledge expansion beyond Earth\'s atmosphere.',
                    connections: []
                },
                { 
                    id: 'crypto', 
                    label: 'CRYPTOGRAPHY', 
                    position: [5, 0, -2], 
                    expanded: false, 
                    color: '#ff9ff3',
                    size: 0.7,
                    description: 'Mathematical foundations of secure communication and data protection.',
                    connections: []
                },
                { 
                    id: 'neuro', 
                    label: 'NEUROSCIENCE', 
                    position: [-2, 4, 2], 
                    expanded: false, 
                    color: '#7bed9f',
                    size: 0.7,
                    description: 'Scientific study of the nervous system and brain function.',
                    connections: []
                },
                { 
                    id: 'robotics', 
                    label: 'ROBOTICS', 
                    position: [1, 3, -4], 
                    expanded: false, 
                    color: '#5f27cd',
                    size: 0.7,
                    description: 'Engineering discipline focused on creating autonomous mechanical systems.',
                    connections: []
                },
                { 
                    id: 'renewable', 
                    label: 'RENEWABLE ENERGY', 
                    position: [-5, 1, 3], 
                    expanded: false, 
                    color: '#00cec9',
                    size: 0.7,
                    description: 'Sustainable energy solutions for a carbon-neutral future.',
                    connections: []
                }
            ],
            connections: [
                { from: 'root', to: 'ai' },
                { from: 'root', to: 'quantum' },
                { from: 'root', to: 'biotech' },
                { from: 'root', to: 'space' },
                { from: 'ai', to: 'neuro' },
                { from: 'ai', to: 'robotics' },
                { from: 'quantum', to: 'crypto' },
                { from: 'biotech', to: 'neuro' },
                { from: 'space', to: 'renewable' },
                { from: 'crypto', to: 'quantum' },
                { from: 'robotics', to: 'ai' },
                { from: 'renewable', to: 'space' }
            ]
        };
        
        // Initialize the enhanced scene
        function init() {
            // Create scene with fog for depth
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0f0f23, 10, 100);
            
            // Create camera with better FOV
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 8, 15);
            
            // Create renderer with enhanced settings
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Enhanced lighting setup
            setupLighting();
            
            // Create particle system
            createParticleSystem();
            
            // Create orbit controls
            createOrbitControls();
            
            // Create enhanced nodes and edges
            createEnhancedNodes();
            createEnhancedEdges();
            
            // Update connection data
            updateConnectionData();
            
            // Add event listeners
            setupEventListeners();
            
            // Update stats
            updateStats();
            
            // Start animation loop
            animate();
        }
        
        function setupLighting() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);
            
            // Main directional light
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(20, 20, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Dynamic point lights
            const pointLight1 = new THREE.PointLight(0x00d4ff, 2, 50);
            pointLight1.position.set(0, 10, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff6b6b, 1.5, 30);
            pointLight2.position.set(-15, 5, 15);
            scene.add(pointLight2);
            
            const pointLight3 = new THREE.PointLight(0x4ecdc4, 1.5, 35);
            pointLight3.position.set(15, -5, -15);
            scene.add(pointLight3);
            
            // Animated rim light
            const rimLight = new THREE.PointLight(0xffffff, 1, 100);
            rimLight.position.set(0, 0, 20);
            scene.add(rimLight);
        }
        
        function createParticleSystem() {
            const particleGeometry = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);
            const particleColors = new Float32Array(particleCount * 3);
            const particleSizes = new Float32Array(particleCount);
            
            for (let i = 0; i < particleCount; i++) {
                // Position
                particlePositions[i * 3] = (Math.random() - 0.5) * 100;
                particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 100;
                particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 100;
                
                // Color
                const color = new THREE.Color();
                color.setHSL(Math.random(), 0.7, 0.5);
                particleColors[i * 3] = color.r;
                particleColors[i * 3 + 1] = color.g;
                particleColors[i * 3 + 2] = color.b;
                
                // Size
                particleSizes[i] = Math.random() * 2 + 0.5;
            }
            
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
            particleGeometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
            
            const particleMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 color;
                    varying vec3 vColor;
                    uniform float time;
                    
                    void main() {
                        vColor = color;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = size * (300.0 / -mvPosition.z) * (1.0 + sin(time + position.x) * 0.1);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    
                    void main() {
                        float distance = length(gl_PointCoord - vec2(0.5));
                        if (distance > 0.5) discard;
                        
                        float alpha = 1.0 - distance * 2.0;
                        gl_FragColor = vec4(vColor, alpha * 0.6);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);
        }
        
        function createEnhancedNodes() {
            graphData.nodes.forEach(nodeData => {
                // Create node with enhanced geometry
                const geometry = new THREE.SphereGeometry(nodeData.size * 0.6, 32, 32);
                
                // Enhanced material with custom shader
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(nodeData.color) },
                        glowColor: { value: new THREE.Color(nodeData.color) },
                        expanded: { value: nodeData.expanded ? 1.0 : 0.0 }
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        varying vec3 vPosition;
                        uniform float time;
                        uniform float expanded;
                        
                        void main() {
                            vNormal = normalize(normalMatrix * normal);
                            vPosition = position;
                            
                            vec3 newPosition = position;
                            newPosition += normal * sin(time + position.x + position.y + position.z) * 0.1 * (expanded + 0.5);
                            
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vNormal;
                        varying vec3 vPosition;
                        uniform float time;
                        uniform vec3 color;
                        uniform vec3 glowColor;
                        uniform float expanded;
                        
                        void main() {
                            float fresnel = dot(vNormal, normalize(vPosition));
                            fresnel = 1.0 - abs(fresnel);
                            
                            float pulse = sin(time * 2.0) * 0.5 + 0.5;
                            vec3 finalColor = mix(color, glowColor, fresnel * (expanded * 0.5 + 0.3));
                            finalColor *= 1.0 + pulse * 0.3;
                            
                            gl_FragColor = vec4(finalColor, 1.0);
                        }
                    `,
                    transparent: true
                });
                
                const node = new THREE.Mesh(geometry, material);
                node.position.set(...nodeData.position);
                node.userData = nodeData;
                node.castShadow = true;
                node.receiveShadow = true;
                
                scene.add(node);
                nodes.set(nodeData.id, node);
                
                // Add enhanced glow effect
                const glowGeometry = new THREE.SphereGeometry(nodeData.size * 0.8, 16, 16);
                const glowMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(nodeData.color) }
                    },
                    vertexShader: `
                        varying vec3 vNormal;
                        uniform float time;
                        
                        void main() {
                            vNormal = normalize(normalMatrix * normal);
                            vec3 newPosition = position * (1.0 + sin(time) * 0.05);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                        }
                    `,
                    fragmentShader: `
                        varying vec3 vNormal;
                        uniform vec3 color;
                        
                        void main() {
                            float intensity = pow(0.8 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                            gl_FragColor = vec4(color, intensity * 0.3);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    side: THREE.BackSide
                });
                
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                node.add(glow);
                
                // Create floating text with better styling
                createFloatingText(nodeData.label, node.position, nodeData.color);
            });
        }
        
        function createFloatingText(text, position, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;
            
            // Create gradient background
            const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, 'rgba(0,0,0,0.9)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
            
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add border
            context.strokeStyle = color;
            context.lineWidth = 2;
            context.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);
            
            // Add text
            context.fillStyle = color;
            context.font = 'bold 32px Orbitron, monospace';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            
            // Add glow effect
            context.shadowColor = color;
            context.shadowBlur = 10;
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ 
                map: texture,
                transparent: true,
                opacity: 0.9
            });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(position.x, position.y + 1.5, position.z);
            sprite.scale.set(4, 1, 1);
            
            scene.add(sprite);
        }
        
        function createEnhancedEdges() {
            graphData.connections.forEach(connection => {
                const fromNode = nodes.get(connection.from);
                const toNode = nodes.get(connection.to);
                
                if (fromNode && toNode) {
                    // Create flowing connection line
                    const points = [];
                    const fromPos = fromNode.position;
                    const toPos = toNode.position;
                    
                    // Create curved path
                    const midPoint = new THREE.Vector3(
                        (fromPos.x + toPos.x) / 2,
                        (fromPos.y + toPos.y) / 2 + 2,
                        (fromPos.z + toPos.z) / 2
                    );
                    
                    for (let i = 0; i <= 50; i++) {
                        const t = i / 50;
                        const point = new THREE.Vector3().lerpVectors(
                            fromPos, 
                            midPoint, 
                            t
                        ).lerp(toPos, t);
                        points.push(point);
                    }
                    
                    const geometry = new THREE.BufferGeometry().setFromPoints(points);
                    const material = new THREE.ShaderMaterial({
                        uniforms: {
                            time: { value: 0 },
                            color: { value: new THREE.Color(0x00d4ff) },
                            opacity: { value: 0.6 }
                        },
                        vertexShader: `
                            uniform float time;
                            attribute float alpha;
                            varying float vAlpha;
                            
                            void main() {
                                vAlpha = sin(time + position.x + position.y) * 0.5 + 0.5;
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `,
                        fragmentShader: `
                            uniform vec3 color;
                            uniform float opacity;
                            varying float vAlpha;
                            
                            void main() {
                                gl_FragColor = vec4(color, opacity * vAlpha);
                            }
                        `,
                        transparent: true,
                        blending: THREE.AdditiveBlending
                    });
                    
                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                    connectionLines.push(line);
                }
            });
        }
        
        function updateConnectionData() {
            graphData.connections.forEach(connection => {
                const fromNode = graphData.nodes.find(n => n.id === connection.from);
                const toNode = graphData.nodes.find(n => n.id === connection.to);
                
                if (fromNode && toNode) {
                    fromNode.connections.push(toNode.label);
                    toNode.connections.push(fromNode.label);
                }
            });
        }
        
        function createOrbitControls() {
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;
            let cameraDistance = 20;
            let targetDistance = 20;
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isMouseDown) {
                    const deltaX = e.clientX - mouseX;
                    const deltaY = e.clientY - mouseY;
                    
                    targetX += deltaX * 0.005;
                    targetY += deltaY * 0.005;
                    targetY = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetY));
                    
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                }
            });
            
            renderer.domElement.addEventListener('wheel', (e) => {
                targetDistance += e.deltaY * 0.01;
                targetDistance = Math.max(5, Math.min(50, targetDistance));
            });
            
            function updateCamera() {
                cameraDistance += (targetDistance - cameraDistance) * 0.05;
                
                camera.position.x = Math.cos(targetX) * Math.cos(targetY) * cameraDistance;
                camera.position.y = Math.sin(targetY) * cameraDistance;
                camera.position.z = Math.sin(targetX) * Math.cos(targetY) * cameraDistance;
                camera.lookAt(0, 0, 0);
            }
            
            controls = { update: updateCamera };
        }
        
        function setupEventListeners() {
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('click', onMouseClick);
            renderer.domElement.addEventListener('dblclick', onDoubleClick);
        }
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(nodes.values()));
            
            // Reset all nodes
            nodes.forEach(node => {
                node.material.uniforms.expanded.value = node.userData.expanded ? 1.0 : 0.0;
                node.scale.set(1, 1, 1);
            });
            
            if (intersects.length > 0) {
                const hoveredNode = intersects[0].object;
                hoveredNode.material.uniforms.expanded.value = 1.5;
                hoveredNode.scale.set(1.3, 1.3, 1.3);
                
                // Show node info with animation
                const nodeInfo = document.getElementById('nodeInfo');
                const nodeTitle = document.getElementById('nodeTitle');
                const nodeDescription = document.getElementById('nodeDescription');
                const nodeConnections = document.getElementById('nodeConnections');
                
                nodeTitle.textContent = hoveredNode.userData.label;
                nodeTitle.style.color = hoveredNode.userData.color;
                nodeDescription.textContent = hoveredNode.userData.description;
                nodeConnections.textContent = `Connected to: ${hoveredNode.userData.connections.join(', ')}`;
                
                if (nodeInfo.style.display === 'none') {
                    nodeInfo.style.display = 'block';
                    nodeInfo.style.animation = 'fadeInUp 0.5s ease-out';
                }
                
                document.body.style.cursor = 'pointer';
            } else {
                document.getElementById('nodeInfo').style.display = 'none';
                document.body.style.cursor = 'grab';
            }
        }
        
        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(nodes.values()));
            
            if (intersects.length > 0) {
                const clickedNode = intersects[0].object;
                toggleNode(clickedNode);
            }
        }
        
        function onDoubleClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(nodes.values()));
            
            if (intersects.length > 0) {
                const focusedNode = intersects[0].object;
                focusOnNode(focusedNode);
            }
        }
        
        function toggleNode(node) {
            node.userData.expanded = !node.userData.expanded;
            
            // Expansion animation
            const tl = createTimeline();
            tl.to(node.scale, { x: 1.8, y: 1.8, z: 1.8, duration: 0.2 })
              .to(node.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
            
            // Update shader uniform
            node.material.uniforms.expanded.value = node.userData.expanded ? 1.0 : 0.0;
            
            updateStats();
        }
        
        function focusOnNode(node) {
            const targetPos = node.position.clone();
            const currentPos = camera.position.clone();
            
            // Animate camera to node
            const distance = 8;
            const newPos = targetPos.clone().add(new THREE.Vector3(
                Math.cos(Date.now() * 0.001) * distance,
                distance * 0.5,
                Math.sin(Date.now() * 0.001) * distance
            ));
            
            animateCameraTo(newPos, targetPos);
        }
        
        function animateCameraTo(position, lookAt) {
            const startPos = camera.position.clone();
            const startLookAt = new THREE.Vector3(0, 0, 0);
            let progress = 0;
            
            function animate() {
                progress += 0.02;
                if (progress >= 1) progress = 1;
                
                camera.position.lerpVectors(startPos, position, easeInOutCubic(progress));
                const currentLookAt = new THREE.Vector3().lerpVectors(startLookAt, lookAt, easeInOutCubic(progress));
                camera.lookAt(currentLookAt);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            animate();
        }
        
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        
        function createTimeline() {
            const animations = [];
            
            return {
                to: (target, props) => {
                    animations.push({ target, props });
                    return this;
                }
            };
        }
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            
            // Update controls
            controls.update();
            
            // Update particle system
            if (particleSystem) {
                particleSystem.material.uniforms.time.value = time;
                particleSystem.rotation.y += 0.001;
            }
            
            // Update nodes with advanced animations
            nodes.forEach(node => {
                // Update shader uniforms
                node.material.uniforms.time.value = time;
                
                // Floating animation
                const originalY = node.userData.position[1];
                node.position.y = originalY + Math.sin(time * 0.5 + node.position.x) * 0.3;
                
                // Glow children animation
                if (node.children.length > 0) {
                    node.children[0].material.uniforms.time.value = time;
                }
            });
            
            // Update connection lines
            connectionLines.forEach(line => {
                if (line.material.uniforms) {
                    line.material.uniforms.time.value = time;
                }
            });
            
            // Update FPS counter
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = currentTime;
            }
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function updateStats() {
            document.getElementById('nodeCount').textContent = nodes.size;
            document.getElementById('connectionCount').textContent = connectionLines.length;
        }
        
        // Enhanced control functions
        function resetView() {
            animateCameraTo(new THREE.Vector3(8, 8, 15), new THREE.Vector3(0, 0, 0));
        }
        
        function expandAll() {
            nodes.forEach(node => {
                node.userData.expanded = true;
                node.material.uniforms.expanded.value = 1.0;
                
                // Staggered animation
                setTimeout(() => {
                    const tl = createTimeline();
                    tl.to(node.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 0.3 })
                      .to(node.scale, { x: 1, y: 1, z: 1, duration: 0.2 });
                }, Math.random() * 1000);
            });
        }
        
        function collapseAll() {
            nodes.forEach(node => {
                if (node.userData.id !== 'root') {
                    node.userData.expanded = false;
                    node.material.uniforms.expanded.value = 0.0;
                }
            });
        }
        
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            // Add physics simulation toggle logic here
        }
        
        function toggleConnections() {
            connectionsVisible = !connectionsVisible;
            connectionLines.forEach(line => {
                line.visible = connectionsVisible;
            });
        }
        
        function addRandomNode() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#ff9ff3', '#7bed9f', '#5f27cd', '#00cec9'];
            const topics = [
                'QUANTUM AI', 'NANOTECH', 'FUSION ENERGY', 'GENE THERAPY', 
                'AUGMENTED REALITY', 'BLOCKCHAIN', 'DARK MATTER', 'CONSCIOUSNESS'
            ];
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            const randomPosition = [
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15,
                (Math.random() - 0.5) * 15
            ];
            
            const nodeData = {
                id: Date.now().toString(),
                label: randomTopic,
                position: randomPosition,
                expanded: false,
                color: randomColor,
                size: 0.6 + Math.random() * 0.4,
                description: `Advanced research node in ${randomTopic} with cutting-edge applications.`,
                connections: []
            };
            
            // Create enhanced node
            const geometry = new THREE.SphereGeometry(nodeData.size * 0.6, 32, 32);
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color: { value: new THREE.Color(nodeData.color) },
                    glowColor: { value: new THREE.Color(nodeData.color) },
                    expanded: { value: 0.0 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    uniform float time;
                    uniform float expanded;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        
                        vec3 newPosition = position;
                        newPosition += normal * sin(time + position.x + position.y + position.z) * 0.1 * (expanded + 0.5);
                        
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    uniform float time;
                    uniform vec3 color;
                    uniform vec3 glowColor;
                    uniform float expanded;
                    
                    void main() {
                        float fresnel = dot(vNormal, normalize(vPosition));
                        fresnel = 1.0 - abs(fresnel);
                        
                        float pulse = sin(time * 2.0) * 0.5 + 0.5;
                        vec3 finalColor = mix(color, glowColor, fresnel * (expanded * 0.5 + 0.3));
                        finalColor *= 1.0 + pulse * 0.3;
                        
                        gl_FragColor = vec4(finalColor, 1.0);
                    }
                `,
                transparent: true
            });
            
            const node = new THREE.Mesh(geometry, material);
            node.position.set(...nodeData.position);
            node.userData = nodeData;
            node.castShadow = true;
            node.receiveShadow = true;
            
            // Entrance animation
            node.scale.set(0, 0, 0);
            scene.add(node);
            nodes.set(nodeData.id, node);
            
            // Animate entrance
            const tl = createTimeline();
            tl.to(node.scale, { x: 1.5, y: 1.5, z: 1.5, duration: 0.5 })
              .to(node.scale, { x: 1, y: 1, z: 1, duration: 0.3 });
            
            // Add glow effect
            const glowGeometry = new THREE.SphereGeometry(nodeData.size * 0.8, 16, 16);
            const glowMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color: { value: new THREE.Color(nodeData.color) }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    uniform float time;
                    
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vec3 newPosition = position * (1.0 + sin(time) * 0.05);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    uniform vec3 color;
                    
                    void main() {
                        float intensity = pow(0.8 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(color, intensity * 0.3);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide
            });
            
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            node.add(glow);
            
            // Add floating text
            createFloatingText(nodeData.label, node.position, nodeData.color);
            
            // Connect to nearest node
            let nearestNode = null;
            let nearestDistance = Infinity;
            
            nodes.forEach(existingNode => {
                if (existingNode.userData.id !== nodeData.id) {
                    const distance = node.position.distanceTo(existingNode.position);
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        nearestNode = existingNode;
                    }
                }
            });
            
            if (nearestNode) {
                // Create connection
                const points = [];
                const fromPos = node.position;
                const toPos = nearestNode.position;
                
                const midPoint = new THREE.Vector3(
                    (fromPos.x + toPos.x) / 2,
                    (fromPos.y + toPos.y) / 2 + 2,
                    (fromPos.z + toPos.z) / 2
                );
                
                for (let i = 0; i <= 50; i++) {
                    const t = i / 50;
                    const point = new THREE.Vector3().lerpVectors(fromPos, midPoint, t).lerp(toPos, t);
                    points.push(point);
                }
                
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(nodeData.color) },
                        opacity: { value: 0.6 }
                    },
                    vertexShader: `
                        uniform float time;
                        varying float vAlpha;
                        
                        void main() {
                            vAlpha = sin(time + position.x + position.y) * 0.5 + 0.5;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float opacity;
                        varying float vAlpha;
                        
                        void main() {
                            gl_FragColor = vec4(color, opacity * vAlpha);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                
                const line = new THREE.Line(geometry, material);
                scene.add(line);
                connectionLines.push(line);
                
                // Update connection data
                nodeData.connections.push(nearestNode.userData.label);
                nearestNode.userData.connections.push(nodeData.label);
            }
            
            updateStats();
        }
        
        // Initialize the application
        init();
    </script>
