<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mind Map / Knowledge Graph</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #controls h3 {
            margin: 0 0 15px 0;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        #controls button {
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            border: none;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        #controls button:hover {
            background: linear-gradient(45deg, #0099cc, #00d4ff);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }
        
        #nodeInfo {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 250px;
            display: none;
        }
        
        .node-title {
            color: #00d4ff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .node-description {
            color: #ccc;
            font-size: 14px;
            line-height: 1.4;
        }
        
        .glow {
            text-shadow: 0 0 10px currentColor;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>🧠 Mind Map Controls</h3>
            <button onclick="resetView()">Reset View</button>
            <button onclick="expandAll()">Expand All</button>
            <button onclick="collapseAll()">Collapse All</button>
            <button onclick="addRandomNode()">Add Node</button>
        </div>
        
        <div id="info">
            <div class="glow" style="color: #00d4ff;">💡 Instructions:</div>
            <div style="margin-top: 10px; font-size: 14px;">
                • Click nodes to expand/collapse<br>
                • Mouse to orbit camera<br>
                • Scroll to zoom<br>
                • Nodes pulse when expandable
            </div>
        </div>
        
        <div id="nodeInfo">
            <div class="node-title" id="nodeTitle"></div>
            <div class="node-description" id="nodeDescription"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global variables
        let scene, camera, renderer, controls;
        let nodes = new Map();
        let edges = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let selectedNode = null;
        let animationId;
        
        // Knowledge graph data
        const graphData = {
            nodes: [
                { 
                    id: 'root', 
                    label: 'Knowledge Base', 
                    position: [0, 0, 0], 
                    expanded: true, 
                    color: '#00d4ff',
                    description: 'Central hub of all knowledge and concepts'
                },
                { 
                    id: 'science', 
                    label: 'Science', 
                    position: [3, 2, 1], 
                    expanded: false, 
                    color: '#ff6b6b',
                    description: 'Study of the natural world through observation and experimentation'
                },
                { 
                    id: 'technology', 
                    label: 'Technology', 
                    position: [-3, 1, 2], 
                    expanded: false, 
                    color: '#4ecdc4',
                    description: 'Application of scientific knowledge for practical purposes'
                },
                { 
                    id: 'philosophy', 
                    label: 'Philosophy', 
                    position: [2, -2, -1], 
                    expanded: false, 
                    color: '#45b7d1',
                    description: 'Study of fundamental questions about existence, knowledge, and ethics'
                },
                { 
                    id: 'arts', 
                    label: 'Arts', 
                    position: [-2, -1, -2], 
                    expanded: false, 
                    color: '#f9ca24',
                    description: 'Creative expression through various mediums and forms'
                },
                { 
                    id: 'physics', 
                    label: 'Physics', 
                    position: [4, 3, 0], 
                    expanded: false, 
                    color: '#ff9ff3',
                    description: 'Study of matter, energy, and their interactions'
                },
                { 
                    id: 'biology', 
                    label: 'Biology', 
                    position: [2, 3, 2], 
                    expanded: false, 
                    color: '#7bed9f',
                    description: 'Science of life and living organisms'
                },
                { 
                    id: 'ai', 
                    label: 'AI', 
                    position: [-4, 2, 1], 
                    expanded: false, 
                    color: '#5f27cd',
                    description: 'Artificial intelligence and machine learning systems'
                },
                { 
                    id: 'web', 
                    label: 'Web Dev', 
                    position: [-2, 0, 3], 
                    expanded: false, 
                    color: '#00cec9',
                    description: 'Development of websites and web applications'
                }
            ],
            connections: [
                { from: 'root', to: 'science' },
                { from: 'root', to: 'technology' },
                { from: 'root', to: 'philosophy' },
                { from: 'root', to: 'arts' },
                { from: 'science', to: 'physics' },
                { from: 'science', to: 'biology' },
                { from: 'technology', to: 'ai' },
                { from: 'technology', to: 'web' },
                { from: 'philosophy', to: 'science' },
                { from: 'arts', to: 'philosophy' }
            ]
        };
        
        // Initialize the scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 5, 10);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Add point lights for dramatic effect
            const pointLight1 = new THREE.PointLight(0x00d4ff, 1, 50);
            pointLight1.position.set(0, 10, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff6b6b, 0.8, 30);
            pointLight2.position.set(-10, 0, 10);
            scene.add(pointLight2);
            
            // Create orbit controls
            createOrbitControls();
            
            // Create nodes and edges
            createNodes();
            createEdges();
            
            // Add event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('click', onMouseClick);
            
            // Start animation loop
            animate();
        }
        
        function createOrbitControls() {
            // Simple orbit controls implementation
            let isMouseDown = false;
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;
            let cameraDistance = 15;
            
            renderer.domElement.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            renderer.domElement.addEventListener('mouseup', () => {
                isMouseDown = false;
            });
            
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (isMouseDown) {
                    const deltaX = e.clientX - mouseX;
                    const deltaY = e.clientY - mouseY;
                    
                    targetX += deltaX * 0.01;
                    targetY += deltaY * 0.01;
                    
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                }
            });
            
            renderer.domElement.addEventListener('wheel', (e) => {
                cameraDistance += e.deltaY * 0.01;
                cameraDistance = Math.max(5, Math.min(50, cameraDistance));
            });
            
            // Update camera position
            function updateCamera() {
                camera.position.x = Math.cos(targetX) * Math.cos(targetY) * cameraDistance;
                camera.position.y = Math.sin(targetY) * cameraDistance;
                camera.position.z = Math.sin(targetX) * Math.cos(targetY) * cameraDistance;
                camera.lookAt(0, 0, 0);
            }
            
            controls = { update: updateCamera };
        }
        
        function createNodes() {
            graphData.nodes.forEach(nodeData => {
                const geometry = new THREE.SphereGeometry(0.5, 32, 32);
                const material = new THREE.MeshPhongMaterial({ 
                    color: nodeData.color,
                    emissive: nodeData.color,
                    emissiveIntensity: 0.2
                });
                
                const node = new THREE.Mesh(geometry, material);
                node.position.set(...nodeData.position);
                node.userData = nodeData;
                node.castShadow = true;
                node.receiveShadow = true;
                
                scene.add(node);
                nodes.set(nodeData.id, node);
                
                // Add text label
                createTextLabel(nodeData.label, node.position, nodeData.color);
            });
        }
        
        function createTextLabel(text, position, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 256;
            canvas.height = 64;
            
            context.fillStyle = 'rgba(0, 0, 0, 0.8)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            context.fillStyle = color;
            context.font = 'bold 24px Arial';
            context.textAlign = 'center';
            context.fillText(text, canvas.width / 2, canvas.height / 2 + 8);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(position.x, position.y + 1, position.z);
            sprite.scale.set(2, 0.5, 1);
            
            scene.add(sprite);
        }
        
        function createEdges() {
            graphData.connections.forEach(connection => {
                const fromNode = nodes.get(connection.from);
                const toNode = nodes.get(connection.to);
                
                if (fromNode && toNode) {
                    const geometry = new THREE.BufferGeometry().setFromPoints([
                        fromNode.position,
                        toNode.position
                    ]);
                    
                    const material = new THREE.LineBasicMaterial({ 
                        color: 0x444444,
                        opacity: 0.6,
                        transparent: true
                    });
                    
                    const line = new THREE.Line(geometry, material);
                    scene.add(line);
                    edges.push(line);
                }
            });
        }
        
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Raycast for hover effects
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(nodes.values()));
            
            // Reset all nodes
            nodes.forEach(node => {
                node.material.emissiveIntensity = 0.2;
                node.scale.set(1, 1, 1);
            });
            
            if (intersects.length > 0) {
                const hoveredNode = intersects[0].object;
                hoveredNode.material.emissiveIntensity = 0.5;
                hoveredNode.scale.set(1.2, 1.2, 1.2);
                
                // Show node info
                const nodeInfo = document.getElementById('nodeInfo');
                const nodeTitle = document.getElementById('nodeTitle');
                const nodeDescription = document.getElementById('nodeDescription');
                
                nodeTitle.textContent = hoveredNode.userData.label;
                nodeDescription.textContent = hoveredNode.userData.description;
                nodeInfo.style.display = 'block';
                
                document.body.style.cursor = 'pointer';
            } else {
                document.getElementById('nodeInfo').style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }
        
        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(Array.from(nodes.values()));
            
            if (intersects.length > 0) {
                const clickedNode = intersects[0].object;
                toggleNode(clickedNode);
            }
        }
        
        function toggleNode(node) {
            node.userData.expanded = !node.userData.expanded;
            
            // Animation effect
            const originalScale = node.scale.clone();
            node.scale.set(1.5, 1.5, 1.5);
            
            setTimeout(() => {
                node.scale.copy(originalScale);
            }, 200);
            
            // Update visual state
            if (node.userData.expanded) {
                node.material.emissiveIntensity = 0.4;
            } else {
                node.material.emissiveIntensity = 0.2;
            }
        }
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Update controls
            controls.update();
            
            // Animate nodes
            const time = Date.now() * 0.001;
            nodes.forEach(node => {
                // Gentle floating animation
                node.position.y += Math.sin(time + node.position.x) * 0.01;
                
                // Pulse effect for expandable nodes
                if (!node.userData.expanded) {
                    const pulse = Math.sin(time * 2) * 0.1 + 1;
                    node.material.emissiveIntensity = 0.2 + pulse * 0.1;
                }
            });
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Control functions
        function resetView() {
            camera.position.set(5, 5, 10);
            camera.lookAt(0, 0, 0);
        }
        
        function expandAll() {
            nodes.forEach(node => {
                node.userData.expanded = true;
                node.material.emissiveIntensity = 0.4;
            });
        }
        
        function collapseAll() {
            nodes.forEach(node => {
                if (node.userData.id !== 'root') {
                    node.userData.expanded = false;
                    node.material.emissiveIntensity = 0.2;
                }
            });
        }
        
        function addRandomNode() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#ff9ff3', '#7bed9f', '#5f27cd'];
            const topics = ['Machine Learning', 'Quantum Physics', 'Blockchain', 'Neuroscience', 'Robotics', 'Genetics', 'Astronomy'];
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            const randomPosition = [
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10,
                (Math.random() - 0.5) * 10
            ];
            
            const nodeData = {
                id: Date.now().toString(),
                label: randomTopic,
                position: randomPosition,
                expanded: false,
                color: randomColor,
                description: `Randomly generated node about ${randomTopic}`
            };
            
            // Create the node
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshPhongMaterial({ 
                color: nodeData.color,
                emissive: nodeData.color,
                emissiveIntensity: 0.2
            });
            
            const node = new THREE.Mesh(geometry, material);
            node.position.set(...nodeData.position);
            node.userData = nodeData;
            node.castShadow = true;
            node.receiveShadow = true;
            
            scene.add(node);
            nodes.set(nodeData.id, node);
            
            // Add text label
            createTextLabel(nodeData.label, node.position, nodeData.color);
            
            // Connect to root
            const rootNode = nodes.get('root');
            if (rootNode) {
                const geometry = new THREE.BufferGeometry().setFromPoints([
                    rootNode.position,
                    node.position
                ]);
                
                const material = new THREE.LineBasicMaterial({ 
                    color: 0x444444,
                    opacity: 0.6,
                    transparent: true
                });
                
                const line = new THREE.Line(geometry, material);
                scene.add(line);
                edges.push(line);
            }
        }
        
        // Initialize the application
        init();
    </script>
</body>
</html>
